<!DOCTYPE html>
<html lang="en" data-th="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S Arabian Ltd &#8211; Creator Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F19;--card:rgba(22,29,48,.75);--tx:#e8eefc;--mut:#8b97b5;--cy:#00F0FF;--pu:#9D00FF;--s1:rgba(0,0,0,.55);--s2:rgba(70,90,150,.2);--in:rgba(0,0,0,.28)}
:root:not([data-th=dark]){}
html[data-th=light]{--bg:#e6eaf4;--card:rgba(255,255,255,.72);--tx:#16203a;--mut:#56627f;--s1:rgba(120,135,175,.5);--s2:rgba(255,255,255,.95);--in:rgba(120,135,175,.25)}
*{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Poppins,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:dr 22s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:var(--pu);top:-120px;left:-100px}.o2{width:460px;height:460px;background:var(--cy);right:-120px;top:25%;animation-delay:-8s}.o3{width:400px;height:400px;background:#ff3d9a;bottom:-150px;left:30%;animation-delay:-14s;opacity:.2}
@keyframes dr{to{transform:translate(90px,70px) scale(1.2)}}
.floor{position:absolute;left:-50%;width:200%;bottom:0;height:45%;background:linear-gradient(var(--cy) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,var(--cy) 1px,transparent 1px) 0 0/60px 60px;opacity:.12;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000);animation:gr 6s linear infinite}
@keyframes gr{to{background-position:0 60px,60px 0}}
#spot{position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,30%),rgba(157,0,255,.14),transparent 60%)}
canvas{position:absolute;inset:0}
.glass{position:relative;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;box-shadow:9px 9px 22px var(--s1),-6px -6px 16px var(--s2),inset 1px 1px 2px rgba(255,255,255,.07),inset -3px -3px 8px var(--in)}
.glass::before{content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;background:linear-gradient(135deg,rgba(0,240,255,.75),rgba(157,0,255,.45) 45%,transparent 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;margin:10px;border-radius:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;cursor:pointer}.brand img,.brand svg{width:34px;height:34px;border-radius:9px;object-fit:cover}
nav{display:flex;gap:4px;margin-left:8px}nav a,.lnk{color:var(--mut);cursor:pointer;padding:6px 12px;border-radius:10px;font-weight:600}nav a.on,nav a:hover{color:var(--tx);box-shadow:inset 2px 2px 5px var(--in)}
.sp{flex:1}
.btn{border:0;cursor:pointer;color:#fff;font:600 13px Poppins,sans-serif;padding:9px 16px;border-radius:12px;background:linear-gradient(145deg,#b23cff,var(--pu));box-shadow:4px 4px 10px var(--s1),-2px -2px 8px var(--s2),inset 1px 1px 1px rgba(255,255,255,.35);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(157,0,255,.7),4px 4px 10px var(--s1)}.btn:active{transform:translateY(1px)}
.btn.ok{background:linear-gradient(145deg,#6dfaff,var(--cy));color:#02262a}.btn.ok:hover{box-shadow:0 0 18px rgba(0,240,255,.7)}.btn.g{background:var(--card);color:var(--tx)}.btn.sm{padding:5px 10px;font-size:12px}
.sw{position:relative;width:268px;height:42px;border:0;border-radius:24px;cursor:pointer;background:#0a0e18;box-shadow:inset 4px 4px 9px #000,inset -3px -3px 7px rgba(255,255,255,.07),0 0 0 1px rgba(255,255,255,.05);display:flex;font:600 11px Poppins;color:var(--mut)}
.sw span{flex:1;display:grid;place-items:center;z-index:2;transition:.3s}.sw i{position:absolute;top:4px;left:4px;width:128px;height:34px;border-radius:20px;background:linear-gradient(160deg,#c46bff,var(--pu));box-shadow:0 0 16px var(--pu),0 4px 8px #000,inset 0 2px 2px rgba(255,255,255,.5),inset 0 -3px 5px rgba(0,0,0,.35);transition:.35s cubic-bezier(.5,1.6,.5,1)}
.sw[data-m=c] i{transform:translateX(132px);background:linear-gradient(160deg,#b9feff,var(--cy));box-shadow:0 0 18px var(--cy),0 4px 8px #000,inset 0 2px 2px #fff,inset 0 -3px 5px rgba(0,0,0,.25)}
.sw[data-m=b] span:first-child,.sw[data-m=c] span:last-child{color:#fff}.sw[data-m=c] span:last-child{color:#02262a}
main{max-width:1200px;margin:0 auto;padding:10px 16px 60px}
.hero{position:relative;text-align:center;padding:70px 10px 50px;perspective:900px}
h1{font-size:clamp(30px,5.5vw,62px);line-height:1.08;font-weight:800;margin:0 auto 14px;max-width:900px;background:linear-gradient(180deg,#fff 0%,#9fb0c8 42%,#f0f6ff 55%,#6b7a96 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,240,255,.25))}
html[data-th=light] h1{background-image:linear-gradient(180deg,#2a3558,#7384ad 45%,#1c2547 60%,#5a6a95)}
.hero p{color:var(--mut);max-width:620px;margin:0 auto 22px}
.sh{position:absolute;pointer-events:none;transform-style:preserve-3d;animation:spin 26s linear infinite}
.cube{width:90px;height:90px}.cube i{position:absolute;inset:0;border:1px solid var(--cy);background:rgba(0,240,255,.05);box-shadow:0 0 14px rgba(0,240,255,.35) inset}
.cube i:nth-child(1){transform:translateZ(45px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(45px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
.c2{left:6%;top:30%}.c2 i{border-color:var(--pu);background:rgba(157,0,255,.07)}.c1{right:8%;top:15%;width:120px;height:120px}.c1 i{transform-origin:center}
.ring{width:130px;height:130px;border:2px solid var(--pu);border-radius:50%;left:18%;bottom:6%;box-shadow:0 0 20px var(--pu),inset 0 0 20px var(--pu);animation:spin2 18s linear infinite}
.tri{right:22%;bottom:4%;width:0;height:0;border:40px solid transparent;border-bottom:70px solid rgba(0,240,255,.5);filter:drop-shadow(0 0 8px var(--cy));animation:spin2 14s linear infinite reverse}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(340deg) rotateY(360deg)}}@keyframes spin2{to{transform:rotateX(360deg) rotateY(360deg)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:10px 0 30px}.cols .glass{padding:22px}.cols h3{margin:0 0 6px;color:var(--cy)}.cols .glass:first-child h3{color:#c98bff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:78px;z-index:10;padding:10px 14px;margin-bottom:18px}
.chip{padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);box-shadow:3px 3px 7px var(--s1),-2px -2px 6px var(--s2)}.chip.on{color:#02262a;background:var(--cy);box-shadow:0 0 14px var(--cy)}
input,select,textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(130,150,200,.25);color:var(--tx);border-radius:10px;padding:9px 11px;font:14px Poppins,sans-serif;box-shadow:inset 3px 3px 7px var(--in);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--cy)}
html[data-th=light] input,html[data-th=light] select,html[data-th=light] textarea{background:rgba(255,255,255,.7)}
select option{color:#111}.bar input{max-width:260px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;perspective:1000px}
.card{overflow:hidden;transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;will-change:transform}.card:hover{box-shadow:0 22px 40px var(--s1),0 0 24px rgba(0,240,255,.25)}
.thumb{height:140px;display:grid;place-items:center;font-size:52px;background-size:cover;background-position:center}.pad{padding:14px 16px}
.tag{font-size:11px;font-weight:600;color:var(--cy);text-transform:uppercase;letter-spacing:.06em}.card h3{margin:2px 0 4px;font-size:17px}.card p{margin:0 0 6px;color:var(--mut);font-size:13px}small,.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.price{font-weight:800;font-size:18px;color:var(--cy)}
.co{margin-top:8px;padding:10px;border-radius:12px;box-shadow:inset 3px 3px 7px var(--in);display:grid;gap:6px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}.cm{padding:6px 0;border-bottom:1px solid rgba(130,150,200,.15);font-size:13px}
.panel{padding:20px;margin-bottom:20px}.panel h2{margin-top:0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(130,150,200,.18)}th{color:var(--mut)}.tbl{overflow-x:auto}
.st{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(157,0,255,.25)}.st.Approved,.st.Paid{background:rgba(0,240,255,.25);color:var(--cy)}.st.Removed,.st.Rejected{background:rgba(255,60,90,.25)}
.big{font-size:30px;font-weight:800;color:var(--cy)}
#m{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.6);padding:16px}#m.on{display:grid}#m .glass{width:min(420px,100%);padding:24px;background:rgba(22,29,48,.92)}
html[data-th=light] #m .glass{background:rgba(255,255,255,.95)}.rl{display:grid;gap:6px;margin:8px 0}.rl label{padding:9px;border-radius:10px;box-shadow:inset 2px 2px 5px var(--in);cursor:pointer;font-size:13px}.rl input{width:auto;margin-right:6px}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:14px;display:none}
footer{text-align:center;color:var(--mut);padding:30px;font-size:12px}
@media(max-width:700px){.sw{width:100%}.sw i{width:calc(50% - 6px)}.sw[data-m=c] i{transform:translateX(100%)}.bar{top:128px}.bar input{max-width:none}.sh{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brand img{border-radius:50%;box-shadow:0 0 14px rgba(212,175,55,.55)}
/* ===== About the Founder ===== */
.founder-sec{max-width:1000px;margin:70px auto 30px;padding:0 20px;perspective:1100px}
.founder{position:relative;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:44px;align-items:center;padding:44px;background:rgba(22,29,48,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;border:1px solid rgba(255,255,255,.06);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 1px 1px 2px rgba(255,255,255,.07),inset -3px -3px 10px rgba(0,0,0,.3);transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;will-change:transform}
.founder.live{transition:transform .08s linear}
.founder-frame{position:relative;aspect-ratio:1/1.1;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#1a2238,#121828);box-shadow:16px 16px 34px rgba(0,0,0,.7),-10px -10px 26px rgba(70,90,150,.22),inset 8px 8px 18px rgba(0,0,0,.6),inset -6px -6px 14px rgba(90,110,170,.14),0 0 60px 6px rgba(157,0,255,.38);transform:translateZ(40px)}
.founder-frame:before{content:"";position:absolute;inset:-14px;z-index:-1;border-radius:36px;background:radial-gradient(circle,rgba(157,0,255,.55),transparent 70%);filter:blur(26px)}
.founder-frame .ph{width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0f1424,#1b2440);box-shadow:inset 7px 7px 16px rgba(0,0,0,.75),inset -5px -5px 12px rgba(90,110,170,.2),0 0 0 1px rgba(157,0,255,.35)}
.founder-frame svg{width:52%;height:52%;fill:none;stroke:#B5C2E0;stroke-width:1.6;opacity:.55}
.founder-body{transform:translateZ(25px)}
.founder-badge{display:inline-block;font:600 10px Poppins,sans-serif;letter-spacing:.28em;color:#B5C2E0;border:1px solid rgba(181,194,224,.45);padding:5px 12px;border-radius:20px;margin-bottom:16px}
.founder h3{margin:0 0 10px;font:800 clamp(28px,4vw,40px)/1.1 Poppins,system-ui,sans-serif;letter-spacing:-.01em;background:linear-gradient(120deg,#8a96b4 0%,#f4f7ff 35%,#aab6d3 55%,#ffffff 75%,#8a96b4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.founder-role{display:block;font:700 12px Poppins,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:#00F0FF;margin-bottom:20px;text-shadow:0 0 12px rgba(0,240,255,.45)}
.founder-msg{margin:0;color:#B5C2E0;font-size:16px;line-height:1.85}
@media(max-width:760px){.founder{grid-template-columns:1fr;padding:28px;gap:30px}.founder-frame{max-width:240px;margin:0 auto;width:100%}}
@media(prefers-reduced-motion:reduce){.founder{transform:none!important}}

#m .glass.pm{width:min(520px,100%);max-height:92vh;overflow:auto;border:1px solid rgba(157,0,255,.35);box-shadow:0 0 40px rgba(157,0,255,.25),0 24px 60px rgba(0,0,0,.6),inset 1px 1px 2px rgba(255,255,255,.08)}
.pm-box{margin:16px 0 10px;padding:16px 18px;border-radius:14px;background:rgba(0,0,0,.28);box-shadow:inset 4px 4px 10px rgba(0,0,0,.55),inset -2px -2px 8px rgba(90,110,170,.14)}
.pm-amt{font-weight:700;font-size:15px;margin-top:4px}.pm-amt span{font-weight:800;font-size:24px;color:var(--cy);margin-left:4px;text-shadow:0 0 14px rgba(0,240,255,.4)}
.pm-row{padding:12px 14px;border-radius:12px;font-size:14px;word-break:break-all;box-shadow:inset 3px 3px 7px var(--in);margin-bottom:16px}.pm-row b{color:#B5C2E0}
.pm-btns{display:grid;gap:10px;margin-bottom:12px}.pm-btns .btn{text-align:center;text-decoration:none;display:block}.pm-off{opacity:.45;cursor:not-allowed}
html[data-th=light] .pm-row b{color:var(--tx)}
</style></head><body>
